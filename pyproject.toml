[project]
name = "ilai-sentinel"
dynamic = ["version"]
description = "Local daemon installed on deployed ILAI units to report hardware, LLM, usage, and backup status to Mothership"
# The daemon targets Python >= 3.10. config.py already does the 3.10/3.11
# dual import (tomllib on 3.11+, tomli shim on 3.10) and `tomli` is declared
# for python_version < '3.11', so 3.10 is supported in code and deps. The floor
# was left at >=3.11 by mistake, which made `pip install` REFUSE on the
# provisioned boxes (Ubuntu 22.04 ships Python 3.10): the bootstrap's sentinel
# phase died with exit 5 and the box never enrolled, so it stopped reporting
# to mothership right after the dashboard came up ("stuck at regolo").
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31,<3.0",
    "psutil>=5.9,<7.0",
    "tomli>=2.0; python_version < '3.11'",
    "tomli-w>=1.0",
]
license = {text = "Apache-2.0"}

[project.scripts]
sentinel = "sentinel.cli:main"

[project.urls]
Homepage = "https://github.com/ippocra/ilai-sentinel"
Documentation = "https://github.com/ippocra/ilai-sentinel#readme"
Repository = "https://github.com/ippocra/ilai-sentinel"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/sentinel/_version.py"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]
