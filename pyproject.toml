[project]
name = "ilai-sentinel"
dynamic = ["version"]
description = "Local daemon installed on deployed ILAI units to report hardware, LLM, usage, and backup status to Mothership"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31,<3.0",
    "psutil>=5.9,<7.0",
    "tomli>=2.0; python_version < '3.11'",
    "tomli-w>=1.0",
]
license = {text = "Apache-2.0"}

[project.scripts]
sentinel = "sentinel.cli:main"

[project.urls]
Homepage = "https://github.com/ippocra/ilai-sentinel"
Documentation = "https://github.com/ippocra/ilai-sentinel#readme"
Repository = "https://github.com/ippocra/ilai-sentinel"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/sentinel/_version.py"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]
