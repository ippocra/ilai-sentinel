[project]
name = "ilai-reporter"
version = "0.1.0"
description = "Local daemon installed on deployed ILAI units to report hardware, LLM, usage, and backup status to Mothership"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31,<3.0",
    "psutil>=5.9,<7.0",
]

[project.scripts]
reporter = "reporter.cli:main"

[tool.ruff]
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reporter"]
